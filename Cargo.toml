[package]
name = "orca-ram-guard"
version = "0.2.0"
edition = "2021"
description = "Ultra-light native Rust binary for Orca RAM & Port Guard on macOS"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
